<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="preload" href="assets/fonts/inter-v20-latin-regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="assets/fonts/inter-v20-latin-600.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="assets/fonts/inter-v20-latin-700.woff2" as="font" type="font/woff2" crossorigin="anonymous">

  <link rel="stylesheet" href="styles/style.css">

  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main>
    <h1 class="sr-only">Sample Social Links Profile Card Component</h1>

    <div class="card">
      <img src="assets/images/avatar-jessica.jpeg" alt="" class="card__img" width="176" height="176">
      <div class="card__info">
        <h2 class="card__name">Jessica Randall</h2>
        <address class="card__address">London, United Kingdom</address>
      </div>
      <p class="card__description">Front-end developer and avid reader.</p>
      <ul class="card__socials" role="list">
        <li class="card__social-item">
          <a href="https://github.com/" class="card__social-link">Github</a>
        </li>
        <li class="card__social-item">
          <a href="https://www.frontendmentor.io/" class="card__social-link">Frontend Mentor</a>
        </li>
        <li class="card__social-item">
          <a href="https://www.linkedin.com/" class="card__social-link">LinkedIn</a>
        </li>
        <li class="card__social-item">
          <a href="https://x.com/" class="card__social-link">Twitter</a>
        </li>
        <li class="card__social-item">
          <a href="https://www.instagram.com/" class="card__social-link">Instagram</a>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
